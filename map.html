<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Island Route und Campingkarte</title>
  <link rel="stylesheet" href="leaflet.css" />
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    .legend {
      background: white;
      padding: 10px 12px;
      line-height: 1.6;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.2);
      border-radius: 6px;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    .legend-color {
      display: inline-block;
      width: 16px;
      height: 16px;
      margin-right: 8px;
      vertical-align: middle;
      border-radius: 3px;
      border: 1px solid #999;
    }
    .marker-circle {
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      border: 1.5px solid #222;
      border-radius: 50%;
      box-sizing: border-box;
      line-height: 1;
      text-align: center;
      text-shadow: 0 1px 0 rgba(0,0,0,0.25);
      transition: transform 0.12s ease, opacity 0.12s ease;
    }
    .marker-circle.dim {
      opacity: 0.28;
      transform: scale(0.92);
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="leaflet.js"></script>

      { name: "Secret Lagoon (Flúðir)", type: "Attraktion", lat: 64.1374, lng: -20.3094, day: [2] },
      { name: "Seljalandsfoss", type: "Attraktion", lat: 63.6156, lng: -19.9886, day: [3] },
      { name: "Skógafoss", type: "Attraktion", lat: 63.5321, lng: -19.5113, day: [3] },
      { name: "Reynisfjara Black Sand Beach", type: "Attraktion", lat: 63.4023, lng: -19.0445, day: [3] },

      { name: "Fjaðrárgljúfur Canyon", type: "Attraktion", lat: 63.7713, lng: -18.1718, day: [4] },

      { name: "Whale Watching Húsavík", type: "Attraktion", lat: 66.0465, lng: -17.3422, day: [9] },
      { name: "Glaumbær Turf Houses", type: "Attraktion", lat: 65.6107, lng: -19.5042, day: [10] },
      { name: "Kirkjufell", type: "Attraktion", lat: 64.9417, lng: -23.3069, day: [11] },
      { name: "Arnarstapi", type: "Attraktion", lat: 64.7667, lng: -23.6231, day: [12] },
      { name: "Djúpalónssandur", type: "Attraktion", lat: 64.7536, lng: -23.8953, day: [12] },
      { name: "Sky Lagoon", type: "Attraktion", lat: 64.1236, lng: -21.9384, day: [13] },

      { name: "Reykjavík Campsite", type: "Campingplatz", campingCard: false, lat: 64.146, lng: -21.8753, day: [1, 13] },
      { name: "Sandgerði Campsite", type: "Campingplatz", campingCard: true, lat: 64.0336, lng: -22.7071 },
      { name: "Skjól Camping", type: "Campingplatz", campingCard: true, lat: 64.3111, lng: -20.2319 },
      { name: "Flúðir Campsite", type: "Campingplatz", campingCard: true, lat: 64.1353, lng: -20.3189, day: [2] },
      { name: "Gata Free Camping", type: "Campingplatz", campingCard: true, lat: 63.8406, lng: -21.3912 },
      { name: "Vík Camping", type: "Campingplatz", campingCard: false, lat: 63.4192, lng: -18.9956, day: [3] },
      { name: "Skaftafell Campground", type: "Campingplatz", campingCard: false, lat: 64.0164, lng: -16.9675, day: [4] },
      { name: "Höfn Camping", type: "Campingplatz", campingCard: false, lat: 64.2581, lng: -15.2031, day: [5] },
      { name: "Djúpivogur Campsite", type: "Campingplatz", campingCard: true, lat: 64.6548, lng: -14.2954 },
      { name: "Seyðisfjörður Camping", type: "Campingplatz", campingCard: true, lat: 65.2599, lng: -13.9984, day: [6] },
      { name: "Mývatn (Bjarg Campsite)", type: "Campingplatz", campingCard: false, lat: 65.6411, lng: -16.9131, day: [7, 8] },
      { name: "Fjalladýrd (Möðrudalur)", type: "Campingplatz", campingCard: true, lat: 65.3739, lng: -15.8828 },
      { name: "Húsavík Campground", type: "Campingplatz", campingCard: true, lat: 66.0494, lng: -17.3384 },
      { name: "Hamrar (Akureyri)", type: "Campingplatz", lat: 65.6486, campingCard: false, lng: -18.1025, day: [9] },
      { name: "Varmahlíð Campsite", type: "Campingplatz", campingCard: true, lat: 65.5532, lng: -19.4441, day: [10] },
      { name: "Sauðárkrókur Campsite", type: "Campingplatz", campingCard: true, lat: 65.7424, lng: -19.6515 },
      { name: "Grundarfjörður Campsite", type: "Campingplatz", campingCard: true, lat: 64.9177, lng: -23.2558, day: [11, 12] },
      { name: "Hellissandur Campsite", type: "Campingplatz", campingCard: true, lat: 64.9161, lng: -23.8869 }
    ];

    // Ensure every entry has a `day` attribute (default empty array). Convert numbers to arrays.
    data.forEach(d => {
      // Normalize `day` to always be an array (or empty array if missing)
      if (d.day === undefined || d.day === null) d.day = [];
      else if (!Array.isArray(d.day)) d.day = [d.day];

      // Label the Camping grounds
      if (d.type === 'Campingplatz') {
        if (d.campingCard) {
          if (d.day && d.day.length > 0) {
            d.type = 'Campingplatz (CampingCard & Route)';
          } else {
            d.type = 'Campingplatz (CampingCard)';
          }
          
        } else {
          if (d.day && d.day.length > 0) {
            d.type = 'Campingplatz (Route)';
          } else {
            d.type = 'Campingplatz';
          }
        }
      }
    });

    const colors = {
      "Attraktion": "#1f78b4",
      "Campingplatz (Route)": "#e31a1c",
      "Campingplatz (CampingCard)": "#33a02c",
      "Campingplatz (CampingCard & Route)": "#ff7f00"
    };

    const map = L.map('map').setView([64.5, -19], 6.5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: 'Karte: &copy; OpenStreetMap-Mitwirkende',
      maxZoom: 18
    }).addTo(map);

    // Kilometerskala (nur metrisch) in der linken unteren Ecke
    L.control.scale({ position: 'bottomleft', metric: true, imperial: false }).addTo(map);

    // Create markers as L.marker with a divIcon so we can show the `day` inside the circle
    const markers = data.map(item => {
      const color = colors[item.type] || '#555555';
      const dayText = Array.isArray(item.day) && item.day.length ? item.day.join(',') : '';
      const icon = L.divIcon({
        className: 'camp-div-icon',
        html: `<div class="marker-circle" style="background:${color};">${dayText}</div>`,
        iconSize: [18, 18],
        popupAnchor: [0, -12]
      });
      const marker = L.marker([item.lat, item.lng], { icon }).bindPopup(`<strong>${item.name}</strong><br>${item.type}`);
      marker._item = item;
      marker._color = color;
      return marker;
    });

    const markersLayer = L.layerGroup().addTo(map);

    // add all markers once
    markers.forEach(m => markersLayer.addLayer(m));

    function updateMarkers(filterDay) {
      // normalize
      const fd = (filterDay === 'all' || filterDay === null || filterDay === undefined) ? 'all' : Number(filterDay);
      console.log('updateMarkers filterDay=', fd);
      let matchCount = 0;
      markers.forEach(m => {
        const itemDay = Array.isArray(m._item.day) ? m._item.day : [];
        const isVisible = (fd === 'all') || (Array.isArray(itemDay) && itemDay.includes(fd));
        if (isVisible) matchCount++;
        const el = m.getElement ? m.getElement() : null;
        if (el) {
          const circle = el.querySelector('.marker-circle');
          if (circle) {
            if (isVisible) circle.classList.remove('dim'); else circle.classList.add('dim');
          } else {
            // fallback
            el.style.opacity = isVisible ? '1' : '0.28';
            el.style.transform = isVisible ? 'scale(1)' : 'scale(0.92)';
          }
        }
      });
      console.log('updateMarkers matched', matchCount, 'of', markers.length);
    }

    // show all initially
    updateMarkers('all');

    const bounds = L.featureGroup(markers).getBounds();
    if (bounds.isValid()) {
      map.fitBounds(bounds.pad(0.1));
    }

    allDays = Array.from(new Set(data.flatMap(d => Array.isArray(d.day) ? d.day : []))).sort((a, b) => a - b);

    // Combined control: Tage + Legende
    const controls = L.control({ position: 'bottomright' });
    controls.onAdd = function () {
      const div = L.DomUtil.create('div', 'legend');

      // Days section
      const daysDiv = document.createElement('div');
      daysDiv.innerHTML = '<strong>Tage</strong><br>';
      const btnAll = document.createElement('button');
      btnAll.textContent = 'Alle';
      btnAll.style.margin = '4px 6px 4px 0';
      btnAll.dataset.day = 'all';
      daysDiv.appendChild(btnAll);

      for (let i of allDays) {
        const b = document.createElement('button');
        b.textContent = i;
        b.style.margin = '4px 6px 4px 0';
        b.dataset.day = String(i);
        const has = data.some(d => Array.isArray(d.day) && d.day.includes(i));
        if (!has) b.disabled = true;
        daysDiv.appendChild(b);
      }

      div.appendChild(daysDiv);

      // Legend section
      const legDiv = document.createElement('div');
      legDiv.innerHTML = '<strong>Legende</strong><br>' +
        Object.entries(colors)
          .map(([label, color]) => {
            return `<div><span class="legend-color" style="background:${color}"></span>${label}</div>`;
          })
          .join('');
      div.appendChild(legDiv);

      // click handling for days — robust button detection and stop propagation
      div.addEventListener('click', (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
        try {
          let btn = null;
          const t = ev.target;
          if (t && t.nodeType === 1) {
            btn = t.tagName === 'BUTTON' ? t : t.closest('button');
          } else if (t && t.parentElement) {
            btn = t.parentElement.closest ? t.parentElement.closest('button') : null;
          }
          if (!btn) return;
          const dayAttr = btn.dataset ? btn.dataset.day : undefined;
          if (dayAttr === undefined) return;
          const dayVal = dayAttr === 'all' ? 'all' : parseInt(dayAttr, 10);
          Array.from(div.querySelectorAll('button')).forEach(b => b.style.fontWeight = 'normal');
          btn.style.fontWeight = '700';
          updateMarkers(dayVal);
        } catch (err) {
          console.error('Day button handler error', err);
          updateMarkers('all');
        }
      });

      // default select all
      btnAll.style.fontWeight = '700';

      return div;
    };
    controls.addTo(map);
  </script>
</body>
</html>
