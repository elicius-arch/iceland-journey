<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Island Route und Campingkarte</title>
  <link rel="stylesheet" href="leaflet.css" />
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      min-height: 100%;
    }

    #map {
      width: 100%;
      height: calc(var(--vh, 1vh) * 100);
      min-height: 100%;
    }

    .legend {
      display: flex;
      flex-direction: column;
      background: white;
      padding: 10px 12px;
      line-height: 1.6;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.2);
      border-radius: 6px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      max-width: min(340px, calc(100vw - 24px));
      max-height: 60vh;
      overflow: hidden;
      box-sizing: border-box;
    }
    .overlay-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .toggle-btn {
      border: none;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 4px;
    }
    .toggle-btn:hover {
      background: rgba(0,0,0,0.08);
    }
    .overlay-content {
      overflow-y: auto;
      flex: 1 1 auto;
      min-height: 0;
    }
    .collapsed .overlay-content {
      display: none;
    }
    .collapsed {
      max-height: 46px;
    }

    .legend-color {
      display: inline-block;
      width: 16px;
      height: 16px;
      margin-right: 8px;
      vertical-align: middle;
      border-radius: 3px;
      border: 1px solid #999;
    }

    .legend button {
      border: none;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
      padding: 4px 6px;
      text-align: left;
      border-radius: 4px;
    }
    .legend button:hover,
    .legend button.active {
      background: rgba(0, 0, 0, 0.05);
      font-weight: 700;
    }
    .legend .type-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      margin: 4px 0;
      justify-content: flex-start;
      flex-wrap: wrap;
    }
    .legend .day-btn,
    .legend .names-toggle-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 36px;
      margin: 4px 6px 4px 0;
      padding: 6px 8px;
      border-radius: 4px;
    }
    .legend button.active {
      font-weight: 700;
    }
    .marker-label {
      background: rgba(255, 255, 255, 0.96);
      color: #222;
      border: 1px solid rgba(0, 0, 0, 0.12);
      padding: 4px 8px;
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
      font-size: 13px;
      white-space: nowrap;
      pointer-events: none;
    }
    .marker-label.leaflet-tooltip {
      opacity: 1;
    }
    .marker-circle {
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      border: 1.5px solid #222;
      border-radius: 50%;
      box-sizing: border-box;
      line-height: 1;
      text-align: center;
      text-shadow: 0 1px 0 rgba(0,0,0,0.25);
      transition: transform 0.12s ease, opacity 0.12s ease;
    }
    .marker-circle.dim {
      opacity: 0.28;
      transform: scale(0.92);
    }
    .station-list {
      position: absolute;
      left: 12px;
      top: 80px;
      width: min(350px, calc(100% - 24px));
      max-width: 90vw;
      max-height: 60vh;
      overflow: auto;
      background: white;
      padding: 10px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
      border-radius: 6px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      z-index: 650;
      box-sizing: border-box;
    }
    .station-list ul { list-style: none; margin: 6px 0 0 0; padding: 0; }
    .station-item { display: flex; gap: 8px; align-items: center; padding: 6px 4px; border-bottom: 1px solid #eee; cursor: pointer; }
    .station-item:hover { background: #fafafa; }
    .station-day { min-width: 30px; text-align: center; font-weight:700; color: #333; }
    .station-name { flex: 1; }
    .station-type { font-size: 11px; color: #666; margin-left: 6px; white-space: nowrap; }

    @media (max-width: 768px) {
      .legend {
        font-size: 12px;
        padding: 8px 10px;
        width: calc(100vw - 24px);
        max-width: calc(100vw - 24px);
        max-height: 70vh;
      }
      .overlay-content {
        max-height: none;
      }
      .legend .type-btn {
        flex-wrap: wrap;
        justify-content: flex-start;
      }
      .legend .day-btn {
        margin: 4px 4px 4px 0;
      }
      .station-list {
        position: absolute;
        left: 50%;
        top: 12px;
        bottom: auto;
        transform: translateX(-50%);
        width: calc(100% - 24px);
        max-width: calc(100vw - 24px);
        max-height: 30vh;
      }
      .station-item {
        flex-wrap: wrap;
        justify-content: space-between;
      }
      .station-type {
        margin-left: 0;
        margin-top: 4px;
        width: 100%;
        white-space: normal;
      }
    }
  </style>
</head>

      else if (!Array.isArray(d.day)) d.day = [d.day];

      if (d.type === 'Campingplatz') {

          if (d.day && d.day.length > 0) {
            d.type = 'Campingplatz (CampingCard & Route)';
          } else {
            d.type = 'Campingplatz (CampingCard)';

      "Campingplatz (CampingCard & Route)": "#ff7f00"

      attribution: 'Karte: &copy; OpenStreetMap-Mitwirkende',
      maxZoom: 18
    }).addTo(map);

    // Kilometerskala (nur metrisch) in der linken unteren Ecke
    L.control.scale({ position: 'bottomleft', metric: true, imperial: false }).addTo(map);

    // Create markers as L.marker with a divIcon so we can show the `day` inside the circle

      const color = colors[item.type] || '#555555';
      const dayText = Array.isArray(item.day) && item.day.length ? item.day.join(',') : '';
      const icon = L.divIcon({
        className: 'camp-div-icon',
        html: `<div class="marker-circle" style="background:${color};">${dayText}</div>`,
        iconSize: [18, 18],
        popupAnchor: [0, -12]
      });
      const marker = L.marker([item.lat, item.lng], { icon }).bindPopup(`<strong>${item.name}</strong><br>${item.type}`);
      marker.bindTooltip(item.name, {
        permanent: false,
        direction: 'right',
        className: 'marker-label',
        offset: [10, 0],
        interactive: false
      });
      marker._labelVisible = false;
      marker._item = item;
      marker._color = color;
      return marker;
    });

    const markersLayer = L.layerGroup().addTo(map);

    // add all markers once
    markers.forEach(m => markersLayer.addLayer(m));

    let activeDay = 'all';
    let activeType = 'all';
    let labelsVisible = false;

    function updateMarkers(filterDay, filterType) {
      const dayToUse = (filterDay === undefined || filterDay === null) ? activeDay : filterDay;
      const typeToUse = (filterType === undefined || filterType === null) ? activeType : filterType;
      activeDay = dayToUse;
      activeType = typeToUse;

      const fd = (dayToUse === 'all' || dayToUse === null || dayToUse === undefined) ? 'all' : Number(dayToUse);
      const ft = (typeToUse === 'all' || typeToUse === null || typeToUse === undefined) ? 'all' : typeToUse;
      console.log('updateMarkers filterDay=', fd, 'filterType=', ft);
      let matchCount = 0;
      markers.forEach(m => {
        const itemDay = Array.isArray(m._item.day) ? m._item.day : [];
        const itemType = m._item.type;
        const matchesDay = (fd === 'all') || (Array.isArray(itemDay) && itemDay.includes(fd));
        const matchesType = (ft === 'all') || itemType === ft;
        const isVisible = matchesDay && matchesType;
        if (isVisible) matchCount++;
        const el = m.getElement ? m.getElement() : null;
        if (el) {
          const circle = el.querySelector('.marker-circle');
          if (circle) {
            if (isVisible) circle.classList.remove('dim'); else circle.classList.add('dim');
          } else {
            // fallback
            el.style.opacity = isVisible ? '1' : '0.28';
            el.style.transform = isVisible ? 'scale(1)' : 'scale(0.92)';
          }
        }
      });
      console.log('updateMarkers matched', matchCount, 'of', markers.length);
      // update the right-side station list for the active filter
      try { renderStationList(fd, ft); } catch (e) { /* render may not be defined yet during initial load */ }
      if (labelsVisible) updateMarkerLabels(fd, ft);
    }

    // show all initially
    updateMarkers('all', 'all');

    const bounds = L.featureGroup(markers).getBounds();
    if (bounds.isValid()) {
      map.fitBounds(bounds.pad(0.1));
    }

    allDays = Array.from(new Set(data.flatMap(d => Array.isArray(d.day) ? d.day : []))).sort((a, b) => a - b);

    // Create right-side station list container inside the map
    const stationListDiv = L.DomUtil.create('div', 'station-list collapsed', map.getContainer());
    stationListDiv.innerHTML = '<div class="overlay-header"><strong>Stationen</strong><div style="display:inline-flex;gap:8px"><button class="copy-btn" title="Kopieren">Kopieren</button><button class="toggle-btn" aria-expanded="false" title="Erweitern">+</button></div></div><div class="overlay-content"><ul class="stations"></ul></div>';
    const stationToggle = stationListDiv.querySelector('.toggle-btn');
    const stationCopyBtn = stationListDiv.querySelector('.copy-btn');
    stationToggle.addEventListener('click', () => {
      const isCollapsed = stationListDiv.classList.toggle('collapsed');
      stationToggle.textContent = isCollapsed ? '+' : '−';
      stationToggle.setAttribute('aria-expanded', String(!isCollapsed));
      stationToggle.title = isCollapsed ? 'Erweitern' : 'Minimieren';
    });
    if (stationCopyBtn) {
      stationCopyBtn.addEventListener('click', (ev) => {
        ev.stopPropagation();
        copyFilteredStationNames();
        const prev = stationCopyBtn.textContent;
        stationCopyBtn.textContent = 'Kopiert';
        setTimeout(() => { stationCopyBtn.textContent = prev; }, 1400);
      });
    }

    // Render the list of stations filtered by day
    function renderStationList(filterDay, filterType) {
      const fd = (filterDay === 'all' || filterDay === null || filterDay === undefined) ? 'all' : Number(filterDay);
      const ft = (filterType === 'all' || filterType === null || filterType === undefined) ? 'all' : filterType;
      const ul = stationListDiv.querySelector('ul.stations');
      ul.innerHTML = '';
      data.forEach((item, idx) => {
        const itemDay = Array.isArray(item.day) ? item.day : [];
        const matchesDay = (fd === 'all') || (Array.isArray(itemDay) && itemDay.includes(fd));
        const matchesType = (ft === 'all') || item.type === ft;
        if (!matchesDay || !matchesType) return;
        const li = document.createElement('li');
        li.className = 'station-item';
        li.dataset.index = idx;
        const dayText = Array.isArray(item.day) && item.day.length ? item.day.join(',') : '';
        li.innerHTML = `<div class="station-day">${dayText}</div><div class="station-name">${item.name}</div><div class="station-type">${item.type}</div>`;
        ul.appendChild(li);
      });
      // attach click handler to open popup and center marker
      ul.querySelectorAll('.station-item').forEach(li => {
        li.addEventListener('click', (ev) => {
          const idx = Number(li.dataset.index);
          const m = markers[idx];
          if (!m) return;
          map.setView(m.getLatLng(), Math.max(map.getZoom(), 10));
          m.openPopup();
        });
      });
    }
    // initial render
    renderStationList('all', 'all');

    function copyFilteredStationNames() {
      const fd = (activeDay === 'all' || activeDay === null || activeDay === undefined) ? 'all' : Number(activeDay);
      const ft = (activeType === 'all' || activeType === null || activeType === undefined) ? 'all' : activeType;
      const names = data.filter(item => {
        const itemDay = Array.isArray(item.day) ? item.day : [];
        const matchesDay = (fd === 'all') || (Array.isArray(itemDay) && itemDay.includes(fd));
        const matchesType = (ft === 'all') || item.type === ft;
        return matchesDay && matchesType;
      }).map(i => i.name);
      const text = names.length ? names.join('\n') : 'Keine Punkte ausgewählt.';
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); } catch (e) { /* ignore */ }
          document.body.removeChild(ta);
        });
      } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (e) { /* ignore */ }
        document.body.removeChild(ta);
      }
    }

    // Combined control: Tage + Legende
    const controls = L.control({ position: window.innerWidth <= 768 ? 'topright' : 'bottomright' });
    controls.onAdd = function () {
      const div = L.DomUtil.create('div', 'legend collapsed');

      const header = document.createElement('div');
      header.className = 'overlay-header';
      header.innerHTML = '<strong>Filter</strong>';
      const toggle = document.createElement('button');
      toggle.className = 'toggle-btn';
      toggle.type = 'button';
      toggle.setAttribute('aria-expanded', 'false');
      toggle.title = 'Erweitern';
      toggle.textContent = '+';
      header.appendChild(toggle);
      div.appendChild(header);

      const content = document.createElement('div');
      content.className = 'overlay-content';

      // Days section
      const daysDiv = document.createElement('div');
      daysDiv.innerHTML = '<strong>Tage</strong><br>';
      const btnAll = document.createElement('button');
      btnAll.textContent = 'Alle';
      btnAll.style.margin = '4px 6px 4px 0';
      btnAll.dataset.day = 'all';
      btnAll.className = 'day-btn';
      daysDiv.appendChild(btnAll);

      for (let i of allDays) {
        const b = document.createElement('button');
        b.textContent = i;
        b.style.margin = '4px 6px 4px 0';
        b.dataset.day = String(i);
        b.className = 'day-btn';
        const has = data.some(d => Array.isArray(d.day) && d.day.includes(i));
        if (!has) b.disabled = true;
        daysDiv.appendChild(b);
      }

      content.appendChild(daysDiv);

      // Legend section
      const legDiv = document.createElement('div');
      legDiv.innerHTML = '<strong>Legende</strong><br>' +
        `<button class="type-btn" data-type="all">Alle Typen</button>` +
        Object.entries(colors)
          .map(([label, color]) => {
            return `<button class="type-btn" data-type="${label}"><span class="legend-color" style="background:${color}"></span>${label}</button>`;
          })
          .join('');
      content.appendChild(legDiv);

      const labelSection = document.createElement('div');
      labelSection.className = 'selected-names-section';
      labelSection.innerHTML = '<strong>Punkte beschriften</strong><br>';
      const namesToggle = document.createElement('button');
      namesToggle.className = 'names-toggle-btn';
      namesToggle.type = 'button';
      namesToggle.textContent = 'Namen einblenden';
      labelSection.appendChild(namesToggle);
      content.appendChild(labelSection);

      namesToggle.addEventListener('click', (event) => {
        event.stopPropagation();
        labelsVisible = !labelsVisible;
        namesToggle.textContent = labelsVisible ? 'Namen ausblenden' : 'Namen einblenden';
        updateMarkerLabels(activeDay, activeType);
      });

      div.appendChild(content);

      toggle.addEventListener('click', (event) => {
        event.stopPropagation();
        const isCollapsed = div.classList.toggle('collapsed');
        toggle.textContent = isCollapsed ? '+' : '−';
        toggle.setAttribute('aria-expanded', String(!isCollapsed));
        updateStationListPosition();
      });

      // click handling for days and legend filters — robust button detection and stop propagation
      content.addEventListener('click', (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
        try {
          let btn = null;
          const t = ev.target;
          if (t && t.nodeType === 1) {
            btn = t.tagName === 'BUTTON' ? t : t.closest('button');
          } else if (t && t.parentElement) {
            btn = t.parentElement.closest ? t.parentElement.closest('button') : null;
          }
          if (!btn) return;

          const dayAttr = btn.dataset ? btn.dataset.day : undefined;
          const typeAttr = btn.dataset ? btn.dataset.type : undefined;

          if (dayAttr !== undefined) {
            const dayVal = dayAttr === 'all' ? 'all' : parseInt(dayAttr, 10);
            Array.from(div.querySelectorAll('.day-btn')).forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateMarkers(dayVal, activeType);
            return;
          }

          if (typeAttr !== undefined) {
            const typeVal = typeAttr === 'all' ? 'all' : typeAttr;
            Array.from(div.querySelectorAll('.type-btn')).forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateMarkers(activeDay, typeVal);
            return;
          }
        } catch (err) {
          console.error('Filter button handler error', err);
          updateMarkers('all', 'all');
        }
      });

      btnAll.classList.add('day-btn');
      btnAll.classList.add('active');
      const defaultTypeBtn = legDiv.querySelector('[data-type="all"]');
      if (defaultTypeBtn) defaultTypeBtn.classList.add('active');

      return div;
    };
    controls.addTo(map);

    function updateMarkerLabels(filterDay, filterType) {
      const fd = (filterDay === 'all' || filterDay === null || filterDay === undefined) ? 'all' : Number(filterDay);
      const ft = (filterType === 'all' || filterType === null || filterType === undefined) ? 'all' : filterType;
      markers.forEach(m => {
        const itemDay = Array.isArray(m._item.day) ? m._item.day : [];
        const itemType = m._item.type;
        const matchesDay = (fd === 'all') || itemDay.includes(fd);
        const matchesType = (ft === 'all') || itemType === ft;
        const isVisible = matchesDay && matchesType;
        if (labelsVisible && isVisible) {
          m.openTooltip();
        } else {
          m.closeTooltip();
        }
      });
    }

    function updateStationListPosition() {
      const legendEl = document.querySelector('.legend');
      if (window.innerWidth <= 768) {
        stationListDiv.style.left = '50%';
        stationListDiv.style.transform = 'translateX(-50%)';
        if (legendEl) {
          const rect = legendEl.getBoundingClientRect();
          stationListDiv.style.top = `${rect.bottom + 12}px`;
        } else {
          stationListDiv.style.top = '12px';
        }
      } else {
        stationListDiv.style.left = '12px';
        stationListDiv.style.transform = 'none';
        stationListDiv.style.top = '80px';
      }
    }

    function updateVh() {
      document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
    }

    updateStationListPosition();
    updateVh();
    window.addEventListener('resize', () => {
      updateStationListPosition();
      updateVh();
      setTimeout(() => map.invalidateSize(), 150);
    });
  </script>
</body>
</html>
